services:

  # =======================================================
  # PostgreSQL
  # =======================================================

  postgres:
    image: postgres:16

    container_name: olist_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # =======================================================
  # FastAPI
  # =======================================================

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: olist_api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}

    ports:
      - "8000:8000"

    volumes:
      - ./logs:/app/logs

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]


# =========================================================
# Volumes
# =========================================================

volumes:
  postgres_data: