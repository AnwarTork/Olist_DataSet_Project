project:
  name: "olist-mlops"
  random_state: 42

database:
  user_env: "DB_USER"
  password_env: "DB_PASSWORD"
  host_env: "DB_HOST"
  port_env: "DB_PORT"
  name_env: "DB_NAME"

#for the docker 
# database:
#   user_env: "DB_USER"
#   password_env: "DB_PASSWORD"
#   host_env: "DB_HOST"
#   port_env: "DB_PORT"
#   name_env: "DB_NAME"

paths:
  ml_table: "data/raw/olist_table.csv"
  labeled_table: "data/processed/labeled_table.csv"
  train: "data/splits/train.csv"
  validation: "data/splits/validation.csv"
  test: "data/splits/test.csv"
  features: "models/features"
  eda_charts: "data/eda_charts"
files:
  data_raw: data/raw
  processed: data/processed
  data_splits: data/splits
  models: models
data:
  target: "is_late"

features:
  categorical:
    - "customer_city"
    - "customer_state"
    - "main_payment_type"

  id_columns:
    - "order_id"
    - "customer_id"
    - "customer_unique_id"

  future_columns:
    - "order_delivered_carrier_date"
    - "order_delivered_customer_date"

  raw_date_columns:
    - "order_purchase_timestamp"

split:
  test_size: 0.30
  validation_size: 0.50
  random_state: 42
training:
  model:
    max_iter: 1000

  baseline:
    C: 1.0
    class_weight: "balanced"

  tuning:
    C_values:
      - 0.01
      - 0.1
      - 1.0
      - 10.0

    class_weights:
      - "balanced"
      - null

  selection_metric: "f1"

random_forest:
    n_estimators: 300
    max_depth: None 
    min_samples_split: 2
    min_samples_leaf: 1
    class_weight: "balanced"
    n_jobs: -1 
xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 11.325789377623654
    objective: "binary:logistic"
    eval_metric: "log_loss"
    n_jobs: -1 
preprocessing:
  numeric_imputer: "median"
  categorical_imputer: "most_frequent"
  scaler: "StandardScaler"
  encoding: "OneHotEncoding"
  handle_unknown: "ignore"

logging:
  level: "INFO"
  log_file: "logs/app.log"
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

model:
  version: "1.0.0"
  path: "models/features/best_model_xgboost.joblib"
  preprocessor_path: "models/features/preprocessor.joblib"

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "olist-late-delivery"
  registered_model_name: "olist-late-delivery-model"
  model_alias: "champion"
  tags:
    project: "olist-mlops"
    task: "late-delivery-classification"